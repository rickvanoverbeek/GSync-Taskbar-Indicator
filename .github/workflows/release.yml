name: Build installer

# Builds the portable exe and the Windows installer. Runs on demand, and on a
# version tag (v1.2.3) it also publishes them to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build (publish exe + compile installer)
        shell: pwsh
        run: .\build.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsync-indicator
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GSyncIndicator-Setup-*.exe
            dist/GSyncIndicator.exe
